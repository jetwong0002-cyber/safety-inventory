<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📦 库存清单 Inventory Checklist (Cloud Sync)</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f8fafc;min-height:100vh;padding:14px 12px 50px}
.wrap{max-width:640px;margin:0 auto}
.header{background:linear-gradient(135deg,#1e3a5f,#2563eb);border-radius:16px;padding:20px 22px 16px;margin-bottom:14px;color:#fff;box-shadow:0 4px 20px rgba(37,99,235,.25); position: relative;}
.header-sub{font-size:11px;letter-spacing:2px;opacity:.7;margin-bottom:3px;text-transform:uppercase}
.header h1{font-size:21px;font-weight:700;margin-bottom:12px}
.prog-row{display:flex;justify-content:space-between;font-size:12px;opacity:.85;margin-bottom:5px}
.prog-bar{background:rgba(255,255,255,.2);border-radius:99px;height:8px;overflow:hidden}
.prog-fill{height:100%;background:#4ade80;border-radius:99px;transition:width .3s}
.sync-status {position: absolute; top: 20px; right: 22px; font-size: 11px; background: rgba(0,0,0,0.2); padding: 4px 8px; border-radius: 6px;}

.toolbar{display:flex;gap:8px;margin-bottom:12px}
.search{flex:1;padding:9px 13px;border:1.5px solid #e2e8f0;border-radius:10px;font-size:14px;outline:none;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.btn{padding:9px 14px;border:none;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn-reset{background:#fff;color:#64748b;border:1.5px solid #e2e8f0; width: 100%; margin-top: 10px;}
.tip{text-align:center;font-size:11px;color:#94a3b8;margin-bottom:12px}

.cat-block{background:#fff;border-radius:14px;margin-bottom:12px;overflow:hidden;box-shadow:0 1px 6px rgba(0,0,0,.07)}
.cat-head{padding:10px 15px;display:flex;align-items:center;justify-content:space-between;border-bottom:1.5px solid}
.cat-name{font-weight:700;font-size:14px}
.cat-badge{font-size:11px;color:#fff;border-radius:99px;padding:2px 9px;font-weight:600}
.row{display:flex;align-items:center;padding:10px 15px;border-bottom:1px solid #f1f5f9;transition:background .15s}
.row:last-child{border-bottom:none}
.row.done{background:#f0fdf4}
.row.done .rname{text-decoration:line-through;color:#86efac}
.row.low-stock .rname::after{content:" ⚠️";font-size:11px}
.chk{width:21px;height:21px;border-radius:6px;border:2px solid #cbd5e1;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-right:11px;cursor:pointer;user-select:none;transition:all .15s}
.chk svg{display:none}
.row.done .chk{background:#16a34a;border-color:#16a34a}
.row.done .chk svg{display:block}
.ricon{font-size:16px;margin-right:8px;flex-shrink:0}
.rname{flex:1;font-size:14px;color:#1e293b;font-weight:500}
.rsub{font-size:10px;color:#94a3b8}
.qty-wrap{text-align:right;flex-shrink:0}
.qty-disp{font-size:13px;font-weight:700;padding:3px 9px;border-radius:7px;display:inline-block;cursor:pointer;border:1.5px dashed transparent;transition:border .15s;user-select:none}
.qty-disp:hover{border-color:currentColor}
.qty-inp{font-size:13px;font-weight:700;padding:3px 7px;border-radius:7px;border:2px solid #2563eb;outline:none;width:85px;text-align:center;display:none}
.qty-unit{font-size:10px;color:#94a3b8;margin-top:1px}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="header-sub">Store Inventory</div>
    <div class="sync-status" id="sync-status">🔄 加载中...</div>
    <h1>📦 库存清单 · Inventory Checklist</h1>
    <div class="prog-row"><span>已检查 / Checked</span><span id="ptxt">0 / 0 (0%)</span></div>
    <div class="prog-bar"><div class="prog-fill" id="pfill" style="width:0%"></div></div>
  </div>

  <div class="toolbar">
    <input class="search" type="text" placeholder="🔍 搜索 / Search..." oninput="doSearch(this.value)">
  </div>
  <div class="tip">✅ 点方块打勾  |  ✏️ 点数量修改 (自动存入云端)</div>

  <div id="inv"></div>
  <button class="btn btn-reset" onclick="doReset()">🔄 重置系统 (恢复默认状态)</button>
</div>
<script>

  {id:"materials",name:"📦 材料耗材 Materials",color:"#dc2626", bg:"#fef2f2", border:"#fecaca"},

// 作为系统被清空或初次运行的备用默认数据
const DEFAULT_ITEMS = [

  {id:"spray_red",   cat:"paint",    icon:"❤️", name:"喷漆 红色 Spray Paint Red",     sub:"",                unit:"个",  qty:5,  low:3},
  {id:"pp_white",    cat:"paint",    icon:"🪣", name:"专业漆 白色 Pro-Paint White",   sub:"1桶=5L",            unit:"桶",  qty:4,  low:2},
  {id:"pp_red",      cat:"paint",    icon:"🪣", name:"专业漆 红色 Pro-Paint Red",     sub:"1桶=5L",            unit:"桶",  qty:4,  low:2},
  {id:"pp_blue",     cat:"paint",    icon:"🪣", name:"专业漆 蓝色 Pro-Paint Blue",    sub:"1桶=5L",            unit:"桶",  qty:1,  low:2},
  {id:"fire_base",   cat:"safety",   icon:"🧯", name:"灭火器底座 Fire Extinguisher Base", sub:"",              unit:"个",  qty:20, low:5},
  {id:"helmet_y",    cat:"safety",   icon:"⛑️", name:"安全帽 黄色 Helmet Yellow",     sub:"",                unit:"包",  qty:6,  low:2},

  {id:"helmet_r",    cat:"safety",   icon:"⛑️", name:"安全帽 红色 Helmet Red",        sub:"",                unit:"袋",  qty:7,  low:2},

  {id:"wp_jacket",   cat:"safety",   icon:"🧥", name:"防水夹克 Waterproof Jacket",    sub:"",                unit:"套",  qty:21, low:3},

  {id:"boot_44",     cat:"safety",   icon:"🥾", name:"安全靴 尺码 44",                sub:"",                unit:"双",  qty:13, low:3},

  {id:"disc_100",    cat:"tools",    icon:"⚙️", name:"切割片 100×6×16mm",             sub:"Cutting Disc",    unit:"片",  qty:79, low:10},
  {id:"tape_measure",cat:"tools",    icon:"📏", name:"卷尺 Measuring Tape KAKO/PMS",  sub:"",                unit:"对",  qty:8,  low:2},
  {id:"battery",     cat:"tools",    icon:"🔋", name:"碱性电池 Greencell Battery",    sub:"1包=2粒",          unit:"对",  qty:15, low:3},
  {id:"lock_biasa",  cat:"tools",    icon:"🔑", name:"普通锁 Lock Biasa",             sub:"",                unit:"个",  qty:8,  low:2},
  {id:"hose_blue",   cat:"materials",icon:"💧", name:"蓝水管 Sunny Hose Blue 2\"×100M",sub:"",               unit:"条",  qty:1,  low:1},
  {id:"delineator",  cat:"materials",icon:"🚧", name:"反光路障 Delineator Reflective",sub:"",                unit:"包",  qty:20, low:5},
  {id:"tape_by",     cat:"materials",icon:"📦", name:"警示胶带 黑黄 Tape Black/Yellow",sub:"",                unit:"个",  qty:11, low:3},
  {id:"tape_grey",   cat:"materials",icon:"📦", name:"警示胶带 灰色 Tape Grey",       sub:"",                unit:"个",  qty:44, low:5},
  {id:"bag_big",     cat:"materials",icon:"🛍️", name:"垃圾袋 大黑 Plastic Bag Big",   sub:"",                unit:"包",  qty:39, low:5},
  {id:"bag_small",   cat:"materials",icon:"🛍️", name:"垃圾袋 小蓝 Plastic Bag Small", sub:"",               unit:"包",  qty:7,  low:2},
  {id:"flag_red",    cat:"materials",icon:"🚩", name:"旗帜 红色 Flag Red",            sub:"",                unit:"个",  qty:24, low:5},
  {id:"flag_green",  cat:"materials",icon:"🚩", name:"旗帜 绿色 Flag Green",          sub:"",                unit:"个",  qty:2,  low:3},
];

// ── State ──────────────────────────────────────────────
let ITEMS = [];
let checked = {};
let quantities = {}; 

function getQty(id){ return quantities[id] !== undefined ? quantities[id] : ITEMS.find(i=>i.id===id).qty; }

// ── Cloud Sync Logic ───────────────────────────────────
const statusEl = document.getElementById('sync-status');

async function initData() {
  try {
    const res = await fetch('/api/sync');
    const data = await res.json();
    
    // 如果云端有数据，则使用云端数据；否则使用默认数据
    if (data && data.items) {
      ITEMS = data.items;
      checked = data.checked || {};
    } else {
      ITEMS = JSON.parse(JSON.stringify(DEFAULT_ITEMS));
      checked = {};
      saveDataToCloud(); // 将默认数据推上云端
    }
    statusEl.textContent = '🟢 已同步';
  } catch (error) {
    console.error('云端拉取失败', error);
    statusEl.textContent = '🔴 离线模式';
    ITEMS = JSON.parse(JSON.stringify(DEFAULT_ITEMS));
  }
  
  ITEMS.forEach(it => { quantities[it.id] = it.qty; });
  render();
}

async function saveDataToCloud() {
  statusEl.textContent = '⏳ 保存中...';
  
  // 更新主数组中的库存数量
  ITEMS.forEach(it => { it.qty = quantities[it.id]; });

  try {
    await fetch('/api/sync', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ items: ITEMS, checked: checked })
    });
    statusEl.textContent = '🟢 已同步';
  } catch (error) {
    statusEl.textContent = '🔴 同步失败';
  }
}

// ── Progress ───────────────────────────────────────────
function updateProgress(){
  const total = ITEMS.length, done = Object.values(checked).filter(Boolean).length;
  const pct = total ? Math.round(done/total*100) : 0;
  document.getElementById('ptxt').textContent = done+' / '+total+' ('+pct+'%)';
  document.getElementById('pfill').style.width = pct+'%';
}

// ── Toggle check ───────────────────────────────────────
function toggleCheck(id){
  checked[id] = !checked[id];
  const el = document.querySelector('[data-id="'+id+'"]');
  if(el) el.classList.toggle('done', !!checked[id]);
  updateProgress();
  saveDataToCloud(); // 勾选后自动保存到云端
}

// ── Qty edit ───────────────────────────────────────────
function startEdit(id){
  document.getElementById('d-'+id).style.display='none';
  const inp = document.getElementById('e-'+id);
  inp.style.display='inline-block';
  inp.value = getQty(id);
  inp.focus(); inp.select();
}
function finishEdit(id){
  const inp = document.getElementById('e-'+id);
  const disp = document.getElementById('d-'+id);
  const v = inp.value.trim();
  if(v !== ''){
    const n = isNaN(v) ? v : Number(v);
    quantities[id] = n;
    disp.textContent = n;
    
    const row = document.querySelector('[data-id="'+id+'"]');
    const item = ITEMS.find(i=>i.id===id);
    if(row && item) row.classList.toggle('low-stock', !isNaN(n) && Number(n) <= item.low && Number(n) > 0);
  }
  inp.style.display='none';
  disp.style.display='inline-block';
  saveDataToCloud(); // 修改数量后自动保存到云端
}

// ── Search ─────────────────────────────────────────────
function doSearch(q){
  q = q.toLowerCase();
  CATS.forEach(cat=>{
    let vis=0;
    ITEMS.filter(i=>i.cat===cat.id).forEach(item=>{
      const el = document.querySelector('[data-id="'+item.id+'"]');
      if(!el) return;
      const show = item.name.toLowerCase().includes(q) || item.sub.toLowerCase().includes(q);
      el.classList.toggle('hidden',!show);
      if(show) vis++;
    });
    const ce = document.getElementById('cat-'+cat.id);
    if(ce) ce.classList.toggle('hidden', vis===0);
  });
}

// ── Reset ──────────────────────────────────────────────
function doReset(){
  if(!confirm('🚨 确定要重置系统吗？\n这将清空云端数据，恢复到初始库存，并取消所有打勾。')) return;
  ITEMS = JSON.parse(JSON.stringify(DEFAULT_ITEMS));
  checked = {};
  ITEMS.forEach(it => { quantities[it.id] = it.qty; });
  render();
  saveDataToCloud();
}

// ── Render ─────────────────────────────────────────────
function render(){
  const inv = document.getElementById('inv');
  inv.innerHTML = CATS.map(cat=>{
    const items = ITEMS.filter(i=>i.cat===cat.id);
    return '<div class="cat-block" id="cat-'+cat.id+'" style="border:1.5px solid '+cat.border+'">'
      +'<div class="cat-head" style="background:'+cat.bg+';border-color:'+cat.border+'">'
      +'<span class="cat-name" style="color:'+cat.color+'">'+cat.name+'</span>'
      +'<span class="cat-badge" style="background:'+cat.color+'">'+items.length+' items</span></div>'
      +items.map(item=>{
        const q = getQty(item.id);
        const qc = (q===0||q==='0') ? '#ef4444' : cat.color;
        const isLow = !isNaN(q) && Number(q)<=item.low && Number(q)>0;
        const isChecked = !!checked[item.id];
        return '<div class="row'+(isLow?' low-stock':'')+(isChecked?' done':'')+'" data-id="'+item.id+'">'
          +'<div class="chk" onclick="toggleCheck(\''+item.id+'\')">'
          +'<svg width="11" height="9" viewBox="0 0 11 9" fill="none"><path d="M1 4L4 7.5L10 1" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>'
          +'<span class="ricon">'+item.icon+'</span>'
          +'<div style="flex:1;min-width:0"><div class="rname">'+item.name+'</div>'+(item.sub?'<div class="rsub">'+item.sub+'</div>':'')+'</div>'
          +'<div class="qty-wrap">'
          +'<span id="d-'+item.id+'" class="qty-disp" style="color:'+qc+';background:'+cat.bg+'" onclick="startEdit(\''+item.id+'\')">'+q+' '+item.unit+'</span>'
          +'<input id="e-'+item.id+'" class="qty-inp" type="text" onblur="finishEdit(\''+item.id+'\')" onkeydown="if(event.key===\'Enter\'||event.key===\'Escape\')finishEdit(\''+item.id+'\')">'
          +'</div></div>';
      }).join('')+'</div>';
  }).join('');
  updateProgress();
}

// 启动应用
initData();
</script>
</body>
</html>
