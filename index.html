<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>仓库清单 Inventory</title>
<style>
/* 保持你的基础布局不变，仅优化双语显示 */
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#f8fafc;color:#0f172a}
.app{max-width:420px;margin:0 auto;padding-bottom:80px}
.header{padding:16px;background:#fff;border-bottom:1px solid #e2e8f0;position:sticky;top:0;z-index:20}
.title{font-size:18px;font-weight:700}
.sync-badge{display:inline-block;padding:2px 8px;border-radius:12px;background:#dcfce7;color:#166534;font-size:10px;margin-top:4px}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:12px;margin:8px 16px;display:flex;align-items:center;gap:12px}
.unit-tag{font-size:11px;background:#f1f5f9;padding:2px 6px;border-radius:4px;color:#475569;cursor:pointer}
/* ...其他样式保持原有紧凑感... */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:16px}
.stat{background:#f1f5f9;padding:10px;border-radius:8px;text-align:center}
.stat-v{font-size:16px;font-weight:700}
.stat-l{font-size:10px;color:#64748b}
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <div style="display:flex;justify-content:space-between;">
      <div>
        <div class="title">📦 仓库清单 Inventory</div>
        <div class="sync-badge">🟢 已同步 Synced</div>
      </div>
      <div style="display:flex;gap:8px">
        <button onclick="alert('Import')">📥 导入 Import</button>
        <button onclick="alert('Export')">📤 分享 Share</button>
      </div>
    </div>
  </div>

  <div class="stats" id="stats"></div>
  <div id="list"></div>
</div>

<script>
// 核心逻辑：定义双语单位映射表
const UNIT_MAP = {
  'pcs': '个 / Pcs',
  'pack': '包 / Pack',
  'box': '箱 / Box',
  'biji': '粒 / Biji',
  'pairs': '双 / Pairs',
  'set': '套 / Set',
  'roll': '卷 / Roll',
  'bottle': '瓶 / Bottle',
  'can': '罐 / Can'
};

// 物品数据（示例：已全部双语化）
let items = [
  {id:'1', name:'威猛先生 Mr. Muscle', sub:'多功能清洁剂 Multi-cleaner', unit:'biji', qty:8},
  {id:'2', name:'高乐氏漂白水 Clorox Bleach', sub:'消毒漂白剂 Disinfectant', unit:'bottle', qty:18}
];

function render() {
  const container = document.getElementById('list');
  container.innerHTML = items.map(it => `
    <div class="card">
      <div style="font-size:24px">🧴</div>
      <div style="flex:1">
        <div style="font-weight:600;font-size:14px">${it.name}</div>
        <div style="font-size:11px;color:#64748b">${it.sub}</div>
        <div style="margin-top:4px">
          <span class="unit-tag">${UNIT_MAP[it.unit] || it.unit}</span>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:10px">
        <button onclick="adj(-1)">-</button>
        <strong>${it.qty}</strong>
        <button onclick="adj(1)">+</button>
      </div>
    </div>
  `).join('');
}

render();
</script>
</body>
</html>
