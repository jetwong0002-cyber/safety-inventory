<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📦 库存清单 Inventory Checklist</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f8fafc;min-height:100vh;padding:14px 12px 50px}
.wrap{max-width:640px;margin:0 auto}
.header{background:linear-gradient(135deg,#1e3a5f,#2563eb);border-radius:16px;padding:20px 22px 16px;margin-bottom:14px;color:#fff;box-shadow:0 4px 20px rgba(37,99,235,.25); position: relative;}
.header-sub{font-size:11px;letter-spacing:2px;opacity:.7;margin-bottom:3px;text-transform:uppercase}
.header h1{font-size:20px;font-weight:700;margin-bottom:12px;line-height:1.3}
.prog-row{display:flex;justify-content:space-between;font-size:12px;opacity:.85;margin-bottom:5px}
.prog-bar{background:rgba(255,255,255,.2);border-radius:99px;height:8px;overflow:hidden}
.prog-fill{height:100%;background:#4ade80;border-radius:99px;transition:width .3s}
.sync-status {position: absolute; top: 16px; right: 16px; font-size: 10px; background: rgba(0,0,0,0.25); padding: 5px 8px; border-radius: 6px; font-weight:600;}

.toolbar{display:flex;gap:8px;margin-bottom:12px}
.search{flex:1;padding:10px 14px;border:1.5px solid #e2e8f0;border-radius:10px;font-size:14px;outline:none;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.btn-toggle-edit{background:#3b82f6;color:#fff;border:none;padding:10px 14px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;box-shadow:0 1px 4px rgba(59,130,246,.3);}
.btn-toggle-edit.active{background:#ef4444;box-shadow:0 1px 4px rgba(239,68,68,.3);}

.btn-reset{background:#fff;color:#64748b;border:1.5px solid #e2e8f0; width: 100%; padding:12px; border-radius:10px; font-size:13px; font-weight:600; cursor:pointer; margin-top: 14px;}
.tip{text-align:center;font-size:11px;color:#64748b;margin-bottom:12px; line-height: 1.5;}

.cat-block{background:#fff;border-radius:14px;margin-bottom:14px;overflow:hidden;box-shadow:0 1px 6px rgba(0,0,0,.07)}
.cat-head{padding:12px 15px;display:flex;align-items:center;justify-content:space-between;border-bottom:1.5px solid}
.cat-name{font-weight:700;font-size:14px}
.cat-badge{font-size:11px;color:#fff;border-radius:99px;padding:3px 10px;font-weight:600}
.row{display:flex;align-items:center;padding:12px 15px;border-bottom:1px solid #f1f5f9;transition:background .15s}
.row:last-child{border-bottom:none}
.row.done{background:#f0fdf4}
.row.done .rname{text-decoration:line-through;color:#86efac}
.row.low-stock .rname::after{content:" ⚠️ Low";font-size:10px;color:#d97706;margin-left:6px;background:#fffbeb;padding:2px 6px;border-radius:4px;}

.chk{width:22px;height:22px;border-radius:6px;border:2px solid #cbd5e1;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-right:12px;cursor:pointer;user-select:none;transition:all .15s}
.chk svg{display:none}
.row.done .chk{background:#16a34a;border-color:#16a34a}
.row.done .chk svg{display:block}

.edit-btn{width:22px;height:22px;border-radius:6px;background:#f1f5f9;color:#64748b;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-right:12px;cursor:pointer;font-size:12px;border:1.5px solid #cbd5e1;}
.edit-btn:active{background:#e2e8f0;}

.ricon{font-size:18px;margin-right:10px;flex-shrink:0;cursor:pointer;}
.rtext-wrap{flex:1;min-width:0;padding-right:8px;}
.rname{font-size:14px;color:#1e293b;font-weight:600;line-height:1.3;margin-bottom:2px;}
.rsub{font-size:11px;color:#94a3b8;line-height:1.2;}
.qty-wrap{text-align:right;flex-shrink:0}
.qty-disp{font-size:14px;font-weight:700;padding:4px 10px;border-radius:8px;display:inline-block;cursor:pointer;border:1.5px dashed transparent;transition:border .15s;user-select:none}
.qty-disp:hover{border-color:currentColor}
.qty-inp{font-size:14px;font-weight:700;padding:4px 8px;border-radius:8px;border:2px solid #2563eb;outline:none;width:80px;text-align:center;display:none}

.add-item-btn{display:block;width:100%;padding:10px;text-align:center;background:#f8fafc;color:#3b82f6;font-size:13px;font-weight:600;cursor:pointer;border-top:1px dashed #cbd5e1;}
.add-cat-btn{display:block;width:100%;padding:14px;text-align:center;background:#fff;border:2px dashed #cbd5e1;color:#64748b;border-radius:14px;font-size:14px;font-weight:600;cursor:pointer;margin-bottom:14px;}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="header-sub">Safety & Store Inventory</div>
    <div class="sync-status" id="sync-status">🔄 加载中 Loading...</div>
    <h1>📦 库存清单<br>Inventory Checklist</h1>
    <div class="prog-row"><span>已检查 / Checked</span><span id="ptxt">0 / 0 (0%)</span></div>
    <div class="prog-bar"><div class="prog-fill" id="pfill" style="width:0%"></div></div>
  </div>

  <div class="toolbar">
    <input class="search" type="text" placeholder="🔍 搜索物品 / Search items..." oninput="doSearch(this.value)">
    <button class="btn-toggle-edit" id="btn-edit" onclick="toggleEditMode()">🛠️ 管理 Admin</button>
  </div>
  
  <div class="tip" id="normal-tip">
    ✅ 勾选方块表示已盘点 (Tick to mark counted)<br>
    ✏️ 点击数字修改库存 (Click quantity to update)
  </div>
  <div class="tip hidden" id="edit-tip" style="color:#ef4444; font-weight:bold;">
    ⚠️ 管理模式已开启: 可随意修改名称、单位、添加新物品
  </div>

  <div id="inv"></div>
  <div id="add-cat-container"></div>
  
  <button class="btn-reset" onclick="doReset()">🚨 恢复出厂设置 / Factory Reset</button>
</div>
<script>
// 默认分类数据
const DEFAULT_CATS = [
  {id:"cleaning", name:"🧴 清洁用品 Cleaning", color:"#2563eb", bg:"#eff6ff", border:"#bfdbfe"},
  {id:"paint",    name:"🎨 油漆喷漆 Paint",     color:"#7c3aed", bg:"#f5f3ff", border:"#ddd6fe"},
  {id:"safety",   name:"🦺 安全设备 Safety",    color:"#059669", bg:"#ecfdf5", border:"#a7f3d0"},
  {id:"tools",    name:"🔧 工具器材 Tools",     color:"#d97706", bg:"#fffbeb", border:"#fde68a"},
  {id:"materials",name:"📦 材料耗材 Materials", color:"#dc2626", bg:"#fef2f2", border:"#fecaca"},
];

// 默认物资数据（单位全部替换为中英双语提示）
const DEFAULT_ITEMS = [
  {id:"mr_muscle",   cat:"cleaning", icon:"🧴", name:"威猛先生 Mr. Muscle",          sub:"多功能清洁剂",      unit:"个/pcs",  qty:8,  low:3},
  {id:"clorox",      cat:"cleaning", icon:"🫧", name:"高乐氏漂白水 Clorox Bleach",   sub:"消毒漂白剂",        unit:"个/pcs",  qty:18, low:5},
  {id:"degreaser",   cat:"cleaning", icon:"🧹", name:"碱性除油剂 Alkaline Degreaser",sub:"工业脱脂剂",        unit:"个/pcs",  qty:3,  low:2},
  {id:"washing_pwd", cat:"cleaning", icon:"🧺", name:"洗衣粉 Washing Powder",        sub:"1包=5kg",          unit:"包/pack", qty:12, low:3},
  {id:"spray_black", cat:"paint",    icon:"🖤", name:"喷漆 (黑) Spray Paint Black",   sub:"",                unit:"罐/can",  qty:10, low:3},
  {id:"spray_white", cat:"paint",    icon:"🤍", name:"喷漆 (白) Spray Paint White",   sub:"",                unit:"罐/can",  qty:20, low:5},
  {id:"pp_white",    cat:"paint",    icon:"🪣", name:"专业漆 (白) Pro-Paint White",   sub:"1桶=5L",           unit:"桶/pail", qty:4,  low:2},
  {id:"fire_base",   cat:"safety",   icon:"🧯", name:"灭火器 Fire Extinguisher",      sub:"含底座",            unit:"套/set",  qty:20, low:5},
  {id:"helmet_y",    cat:"safety",   icon:"⛑️", name:"安全帽 (黄) Helmet Yellow",     sub:"",                unit:"顶/pcs",  qty:6,  low:2},
  {id:"boot_39",     cat:"safety",   icon:"🥾", name:"安全靴 Safety Boot - Size 39",  sub:"",                unit:"双/pair", qty:11, low:3},
  {id:"vest_lg",     cat:"safety",   icon:"🦺", name:"背心 (浅绿) Vest Light Green",  sub:"",                unit:"件/pcs",  qty:5,  low:2},
  {id:"glove_wb",    cat:"safety",   icon:"🧤", name:"手套 (白蓝) Gloves White/Blue", sub:"",                unit:"双/pair", qty:44, low:5},
  {id:"loto_lock",   cat:"tools",    icon:"🔒", name:"LOTO 锁头 LOTO Lock",           sub:"停工安全锁",        unit:"个/pcs",  qty:46, low:10},
  {id:"disc_107",    cat:"tools",    icon:"⚙️", name:"切割片 Cutting Disc 107mm",     sub:"107×1.2×16mm",    unit:"片/pcs",  qty:70, low:10},
  {id:"tape_measure",cat:"tools",    icon:"📏", name:"卷尺 Measuring Tape KAKO",      sub:"",                unit:"个/pcs",  qty:8,  low:2},
  {id:"battery",     cat:"tools",    icon:"🔋", name:"碱性电池 Greencell Battery",    sub:"1包=2粒",          unit:"包/pack", qty:15, low:3},
  {id:"hose_blue",   cat:"materials",icon:"💧", name:"蓝水管 Sunny Hose Blue",        sub:"2\"×100M",        unit:"卷/roll", qty:1,  low:1},
  {id:"tape_by",     cat:"materials",icon:"📦", name:"警示胶带 (黑黄) Warning Tape",  sub:"",                unit:"卷/roll", qty:11, low:3},
  {id:"bag_big",     cat:"materials",icon:"🛍️", name:"垃圾袋 (大黑) Trash Bag Black", sub:"",                unit:"包/pack", qty:39, low:5},
];

let CATS = [];
let ITEMS = [];
let checked = {};
let quantities = {}; 
let isEditMode = false; // 管理模式开关

function getQty(id){ return quantities[id] !== undefined ? quantities[id] : ITEMS.find(i=>i.id===id).qty; }

const statusEl = document.getElementById('sync-status');

// 核心初始化：拉取云端数据时，顺便把动态分类也拉下来
async function initData() {
  try {
    const res = await fetch('/api/sync');
    const data = await res.json();
    
    if (data && data.items && data.items.length > 0) {
      ITEMS = data.items;
      CATS = data.cats && data.cats.length > 0 ? data.cats : JSON.parse(JSON.stringify(DEFAULT_CATS));
      checked = data.checked || {};
    } else {
      throw new Error("Empty DB");
    }
    statusEl.textContent = '🟢 已同步 Synced';
  } catch (error) {
    statusEl.textContent = '🔴 离线 Offline';
    ITEMS = JSON.parse(JSON.stringify(DEFAULT_ITEMS));
    CATS = JSON.parse(JSON.stringify(DEFAULT_CATS));
  }
  
  ITEMS.forEach(it => { quantities[it.id] = it.qty; });
  render();
}

async function saveDataToCloud() {
  statusEl.textContent = '⏳ 保存中 Saving...';
  ITEMS.forEach(it => { it.qty = quantities[it.id]; });

  try {
    const response = await fetch('/api/sync', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      // 现在将 CATS 分类也一起存入数据库，实现分类的动态增加
      body: JSON.stringify({ items: ITEMS, cats: CATS, checked: checked })
    });
    
    if (!response.ok) throw new Error('Failed to save');
    statusEl.textContent = '🟢 已同步 Synced';
  } catch (error) {
    statusEl.textContent = '🔴 同步失败 Failed';
  }
}

// ── 管理模式逻辑 ──
function toggleEditMode() {
  isEditMode = !isEditMode;
  const btn = document.getElementById('btn-edit');
  btn.classList.toggle('active', isEditMode);
  btn.textContent = isEditMode ? '✅ 退出管理 Done' : '🛠️ 管理 Admin';
  document.getElementById('normal-tip').classList.toggle('hidden', isEditMode);
  document.getElementById('edit-tip').classList.toggle('hidden', !isEditMode);
  render(); // 重新渲染界面
}

function addCategory() {
  const newName = prompt("请输入新分类名称 (例如: 🚗 车辆配件 Vehicle Parts):");
  if(!newName) return;
  const newId = "cat_" + Date.now();
  CATS.push({
    id: newId, 
    name: newName, 
    color: "#475569", bg: "#f8fafc", border: "#cbd5e1" // 默认给一个低调的灰蓝色主题
  });
  saveDataToCloud();
  render();
}

function addItem(catId) {
  const newName = prompt("请输入新物品名称及英文 (例如: 铁丝网 Wire Mesh):");
  if(!newName) return;
  const newUnit = prompt("请输入物品单位及英文 (例如: 卷/roll, 个/pcs):", "个/pcs");
  if(!newUnit) return;
  
  const newItemId = "item_" + Date.now();
  ITEMS.push({
    id: newItemId,
    cat: catId,
    icon: "🔹", // 默认图标
    name: newName,
    sub: "",
    unit: newUnit,
    qty: 0,
    low: 5
  });
  quantities[newItemId] = 0;
  saveDataToCloud();
  render();
}

function editItemData(id) {
  const item = ITEMS.find(i=>i.id === id);
  if(!item) return;
  
  const newName = prompt("修改物品名称 Name:", item.name);
  if(newName === null) return;
  
  const newUnit = prompt("修改单位 Unit:", item.unit);
  if(newUnit === null) return;
  
  const newIcon = prompt("修改图标 Emoji:", item.icon);
  if(newIcon === null) return;

  item.name = newName.trim() !== "" ? newName : item.name;
  item.unit = newUnit.trim() !== "" ? newUnit : item.unit;
  item.icon = newIcon.trim() !== "" ? newIcon : item.icon;
  
  saveDataToCloud();
  render();
}
// ─────────────────

function updateProgress(){
  const total = ITEMS.length, done = Object.values(checked).filter(Boolean).length;
  const pct = total ? Math.round(done/total*100) : 0;
  document.getElementById('ptxt').textContent = done+' / '+total+' ('+pct+'%)';
  document.getElementById('pfill').style.width = pct+'%';
}

function toggleCheck(id){
  checked[id] = !checked[id];
  const el = document.querySelector('[data-id="'+id+'"]');
  if(el) el.classList.toggle('done', !!checked[id]);
  updateProgress();
  saveDataToCloud();
}

function startEdit(id){
  document.getElementById('d-'+id).style.display='none';
  const inp = document.getElementById('e-'+id);
  inp.style.display='inline-block';
  inp.value = getQty(id);
  inp.focus(); inp.select();
}

function finishEdit(id){
  const inp = document.getElementById('e-'+id);
  const disp = document.getElementById('d-'+id);
  const v = inp.value.trim();
  if(v !== ''){
    const n = isNaN(v) ? v : Number(v);
    quantities[id] = n;
    disp.textContent = n + ' ' + ITEMS.find(i=>i.id===id).unit;
    const row = document.querySelector('[data-id="'+id+'"]');
    const item = ITEMS.find(i=>i.id===id);
    if(row && item) row.classList.toggle('low-stock', !isNaN(n) && Number(n) <= item.low && Number(n) > 0);
  }
  inp.style.display='none';
  disp.style.display='inline-block';
  saveDataToCloud(); 
}

function doSearch(q){
  q = q.toLowerCase();
  CATS.forEach(cat=>{
    let vis=0;
    ITEMS.filter(i=>i.cat===cat.id).forEach(item=>{
      const el = document.querySelector('[data-id="'+item.id+'"]');
      if(!el) return;
      const show = item.name.toLowerCase().includes(q) || item.sub.toLowerCase().includes(q);
      el.classList.toggle('hidden',!show);
      if(show) vis++;
    });
    const ce = document.getElementById('cat-'+cat.id);
    if(ce) ce.classList.toggle('hidden', vis===0);
  });
}

function doReset(){
  if(!confirm('🚨 警告 Warning:\n彻底清空云端数据库，恢复默认系统？\nWipe cloud DB and reset?')) return;
  ITEMS = JSON.parse(JSON.stringify(DEFAULT_ITEMS));
  CATS = JSON.parse(JSON.stringify(DEFAULT_CATS));
  checked = {};
  ITEMS.forEach(it => { quantities[it.id] = it.qty; });
  render();
  saveDataToCloud(); 
}

function render(){
  const inv = document.getElementById('inv');
  inv.innerHTML = CATS.map(cat=>{
    const items = ITEMS.filter(i=>i.cat===cat.id);
    
    // 如果不在管理模式，且该分类下没有任何物品，则直接隐藏该分类
    if(!isEditMode && items.length === 0) return '';

    let html = '<div class="cat-block" id="cat-'+cat.id+'" style="border:1.5px solid '+cat.border+'">'
      +'<div class="cat-head" style="background:'+cat.bg+';border-color:'+cat.border+'">'
      +'<span class="cat-name" style="color:'+cat.color+'">'+cat.name+'</span>'
      +'<span class="cat-badge" style="background:'+cat.color+'">'+items.length+' 项</span></div>';
      
      html += items.map(item=>{
        const q = getQty(item.id);
        const qc = (q===0||q==='0') ? '#ef4444' : cat.color;
        const isLow = !isNaN(q) && Number(q)<=item.low && Number(q)>0;
        const isChecked = !!checked[item.id];
        
        // 核心：如果是管理模式，显示 ✎ 编辑按钮，否则显示打勾方块
        const actionBtn = isEditMode 
          ? '<div class="edit-btn" onclick="editItemData(\''+item.id+'\')">✎</div>'
          : '<div class="chk" onclick="toggleCheck(\''+item.id+'\')"><svg width="11" height="9" viewBox="0 0 11 9" fill="none"><path d="M1 4L4 7.5L10 1" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>';

        return '<div class="row'+(isLow?' low-stock':'')+(isChecked && !isEditMode?' done':'')+'" data-id="'+item.id+'">'
          + actionBtn
          +'<span class="ricon" '+(isEditMode? 'onclick="editItemData(\''+item.id+'\')"' : '')+'>'+item.icon+'</span>'
          +'<div class="rtext-wrap"><div class="rname">'+item.name+'</div>'+(item.sub?'<div class="rsub">'+item.sub+'</div>':'')+'</div>'
          +'<div class="qty-wrap">'
          +'<span id="d-'+item.id+'" class="qty-disp" style="color:'+qc+';background:'+cat.bg+'" onclick="startEdit(\''+item.id+'\')">'+q+' '+item.unit+'</span>'
          +'<input id="e-'+item.id+'" class="qty-inp" type="text" onblur="finishEdit(\''+item.id+'\')" onkeydown="if(event.key===\'Enter\'||event.key===\'Escape\')finishEdit(\''+item.id+'\')">'
          +'</div></div>';
      }).join('');
      
      // 在管理模式下，每个分类底部添加“新增物品”按钮
      if (isEditMode) {
        html += '<div class="add-item-btn" onclick="addItem(\''+cat.id+'\')">➕ 在此分类下添加新物品 Add Item</div>';
      }
      
      html += '</div>';
      return html;
  }).join('');
  
  // 在管理模式下，页面最底部添加“新增分类”按钮
  const catContainer = document.getElementById('add-cat-container');
  if (isEditMode) {
    catContainer.innerHTML = '<div class="add-cat-btn" onclick="addCategory()">📁 增加全新物资种类 Add New Category</div>';
  } else {
    catContainer.innerHTML = '';
  }

  updateProgress();
}

initData();
</script>
</body>
</html>
