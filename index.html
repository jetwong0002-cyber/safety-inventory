<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📦 库存清单 Inventory Checklist</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f8fafc;min-height:100vh;padding:14px 12px 50px}
.wrap{max-width:640px;margin:0 auto}
.header{background:linear-gradient(135deg,#1e3a5f,#2563eb);border-radius:16px;padding:20px 22px 16px;margin-bottom:14px;color:#fff;box-shadow:0 4px 20px rgba(37,99,235,.25); position: relative;}
.header-sub{font-size:11px;letter-spacing:2px;opacity:.7;margin-bottom:3px;text-transform:uppercase}
.header h1{font-size:20px;font-weight:700;margin-bottom:12px;line-height:1.3}
.prog-row{display:flex;justify-content:space-between;font-size:12px;opacity:.85;margin-bottom:5px}
.prog-bar{background:rgba(255,255,255,.2);border-radius:99px;height:8px;overflow:hidden}
.prog-fill{height:100%;background:#4ade80;border-radius:99px;transition:width .3s}
.sync-status {position: absolute; top: 16px; right: 16px; font-size: 10px; background: rgba(0,0,0,0.25); padding: 5px 8px; border-radius: 6px; font-weight:600;}

.toolbar{display:flex;gap:8px;margin-bottom:12px}
.search{flex:1;padding:10px 14px;border:1.5px solid #e2e8f0;border-radius:10px;font-size:14px;outline:none;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.btn-reset{background:#fff;color:#64748b;border:1.5px solid #e2e8f0; width: 100%; padding:12px; border-radius:10px; font-size:13px; font-weight:600; cursor:pointer; margin-top: 14px;}
.tip{text-align:center;font-size:11px;color:#64748b;margin-bottom:12px; line-height: 1.5;}

.cat-block{background:#fff;border-radius:14px;margin-bottom:14px;overflow:hidden;box-shadow:0 1px 6px rgba(0,0,0,.07)}
.cat-head{padding:12px 15px;display:flex;align-items:center;justify-content:space-between;border-bottom:1.5px solid}
.cat-name{font-weight:700;font-size:14px}
.cat-badge{font-size:11px;color:#fff;border-radius:99px;padding:3px 10px;font-weight:600}
.row{display:flex;align-items:center;padding:12px 15px;border-bottom:1px solid #f1f5f9;transition:background .15s}
.row:last-child{border-bottom:none}
.row.done{background:#f0fdf4}
.row.done .rname{text-decoration:line-through;color:#86efac}
.row.low-stock .rname::after{content:" ⚠️ Low Stock";font-size:10px;color:#d97706;margin-left:6px;background:#fffbeb;padding:2px 6px;border-radius:4px;}
.chk{width:22px;height:22px;border-radius:6px;border:2px solid #cbd5e1;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-right:12px;cursor:pointer;user-select:none;transition:all .15s}
.chk svg{display:none}
.row.done .chk{background:#16a34a;border-color:#16a34a}
.row.done .chk svg{display:block}
.ricon{font-size:18px;margin-right:10px;flex-shrink:0}
.rtext-wrap{flex:1;min-width:0;padding-right:8px;}
.rname{font-size:14px;color:#1e293b;font-weight:600;line-height:1.3;margin-bottom:2px;}
.rsub{font-size:11px;color:#94a3b8;line-height:1.2;}
.qty-wrap{text-align:right;flex-shrink:0}
.qty-disp{font-size:14px;font-weight:700;padding:4px 10px;border-radius:8px;display:inline-block;cursor:pointer;border:1.5px dashed transparent;transition:border .15s;user-select:none}
.qty-disp:hover{border-color:currentColor}
.qty-inp{font-size:14px;font-weight:700;padding:4px 8px;border-radius:8px;border:2px solid #2563eb;outline:none;width:80px;text-align:center;display:none}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="header-sub">Safety & Store Inventory</div>
    <div class="sync-status" id="sync-status">🔄 加载中 Loading...</div>
    <h1>📦 库存清单<br>Inventory Checklist</h1>
    <div class="prog-row"><span>已检查 / Checked</span><span id="ptxt">0 / 0 (0%)</span></div>
    <div class="prog-bar"><div class="prog-fill" id="pfill" style="width:0%"></div></div>
  </div>

  <div class="toolbar">
    <input class="search" type="text" placeholder="🔍 搜索物品 / Search items..." oninput="doSearch(this.value)">
  </div>
  <div class="tip">
    ✅ 勾选方块表示已盘点 (Tick box when counted)<br>
    ✏️ 点击数字可修改数量 (Click quantity to edit)
  </div>

  <div id="inv"></div>
  <button class="btn-reset" onclick="doReset()">🚨 重置系统 / Reset to Factory Default</button>
</div>
<script>
const CATS = [
  {id:"cleaning", name:"🧴 清洁用品 Cleaning Supplies", color:"#2563eb", bg:"#eff6ff", border:"#bfdbfe"},
  {id:"paint",    name:"🎨 油漆喷漆 Paint & Spray",     color:"#7c3aed", bg:"#f5f3ff", border:"#ddd6fe"},
  {id:"safety",   name:"🦺 安全设备 Safety Equipment",  color:"#059669", bg:"#ecfdf5", border:"#a7f3d0"},
  {id:"tools",    name:"🔧 工具器材 Tools & Hardware",  color:"#d97706", bg:"#fffbeb", border:"#fde68a"},
  {id:"materials",name:"📦 材料耗材 Materials & Consumables",color:"#dc2626", bg:"#fef2f2", border:"#fecaca"},
];

const DEFAULT_ITEMS = [
  // Cleaning Supplies
  {id:"mr_muscle",   cat:"cleaning", icon:"🧴", name:"威猛先生 Mr. Muscle",          sub:"多功能清洁剂 / Multi-purpose",      unit:"pcs",  qty:8,  low:3},
  {id:"clorox",      cat:"cleaning", icon:"🫧", name:"高乐氏漂白水 Clorox Bleach",   sub:"消毒漂白剂 / Disinfectant",        unit:"pcs",  qty:18, low:5},
  {id:"degreaser",   cat:"cleaning", icon:"🧹", name:"碱性除油剂 Alkaline Degreaser",sub:"工业脱脂剂 / Industrial Degreaser", unit:"pcs",  qty:3,  low:2},
  {id:"washing_pwd", cat:"cleaning", icon:"🧺", name:"洗衣粉 Washing Powder",        sub:"1包=5kg / 1 pack=5kg",            unit:"pack", qty:12, low:3},
  {id:"freshener",   cat:"cleaning", icon:"🌸", name:"空气清新剂 Room Freshener",    sub:"P-585",                          unit:"pcs",  qty:2,  low:2},
  
  // Paint
  {id:"spray_black", cat:"paint",    icon:"🖤", name:"喷漆 (黑) Spray Paint Black",   sub:"", unit:"pcs",  qty:10, low:3},
  {id:"spray_white", cat:"paint",    icon:"🤍", name:"喷漆 (白) Spray Paint White",   sub:"", unit:"pcs",  qty:20, low:5},
  {id:"spray_blue",  cat:"paint",    icon:"💙", name:"喷漆 (蓝) Spray Paint Blue",    sub:"", unit:"pcs",  qty:8,  low:3},
  {id:"spray_red",   cat:"paint",    icon:"❤️", name:"喷漆 (红) Spray Paint Red",     sub:"", unit:"pcs",  qty:5,  low:3},
  {id:"pp_white",    cat:"paint",    icon:"🪣", name:"专业漆 (白) Pro-Paint White",   sub:"1桶=5L / 1 pail=5L", unit:"pail", qty:4,  low:2},
  {id:"pp_red",      cat:"paint",    icon:"🪣", name:"专业漆 (红) Pro-Paint Red",     sub:"1桶=5L / 1 pail=5L", unit:"pail", qty:4,  low:2},
  {id:"pp_blue",     cat:"paint",    icon:"🪣", name:"专业漆 (蓝) Pro-Paint Blue",    sub:"1桶=5L / 1 pail=5L", unit:"pail", qty:1,  low:2},
  
  // Safety Equipment
  {id:"fire_base",   cat:"safety",   icon:"🧯", name:"灭火器 Fire Extinguisher",      sub:"含底座 / with base", unit:"pcs",  qty:20, low:5},
  {id:"helmet_y",    cat:"safety",   icon:"⛑️", name:"安全帽 (黄) Helmet Yellow",     sub:"", unit:"pcs",  qty:6,  low:2},
  {id:"helmet_w",    cat:"safety",   icon:"⛑️", name:"安全帽 (白) Helmet White",      sub:"", unit:"pcs",  qty:6,  low:2},
  {id:"helmet_r",    cat:"safety",   icon:"⛑️", name:"安全帽 (红) Helmet Red",        sub:"", unit:"pcs",  qty:7,  low:2},
  {id:"rain_coat",   cat:"safety",   icon:"🧥", name:"雨衣 Rain Coat",                sub:"", unit:"pcs",  qty:80, low:10},
  {id:"wp_jacket",   cat:"safety",   icon:"🧥", name:"防水夹克 Waterproof Jacket",    sub:"", unit:"set",  qty:21, low:3},
  {id:"boot_39",     cat:"safety",   icon:"🥾", name:"安全靴 Safety Boot - Size 39",  sub:"", unit:"pairs",qty:11, low:3},
  {id:"boot_40",     cat:"safety",   icon:"🥾", name:"安全靴 Safety Boot - Size 40",  sub:"", unit:"pairs",qty:20, low:3},
  {id:"boot_41",     cat:"safety",   icon:"🥾", name:"安全靴 Safety Boot - Size 41",  sub:"", unit:"pairs",qty:1,  low:3},
  {id:"boot_42",     cat:"safety",   icon:"🥾", name:"安全靴 Safety Boot - Size 42",  sub:"", unit:"pairs",qty:5,  low:3},
  {id:"boot_43",     cat:"safety",   icon:"🥾", name:"安全靴 Safety Boot - Size 43",  sub:"", unit:"pairs",qty:6,  low:3},
  {id:"boot_44",     cat:"safety",   icon:"🥾", name:"安全靴 Safety Boot - Size 44",  sub:"", unit:"pairs",qty:13, low:3},
  {id:"boot_45",     cat:"safety",   icon:"🥾", name:"安全靴 Safety Boot - Size 45",  sub:"", unit:"pairs",qty:22, low:3},
  {id:"boot_46",     cat:"safety",   icon:"🥾", name:"安全靴 Safety Boot - Size 46",  sub:"", unit:"pairs",qty:14, low:3},
  {id:"vest_lg",     cat:"safety",   icon:"🦺", name:"背心 (浅绿) Vest Light Green",  sub:"", unit:"pcs",  qty:5,  low:2},
  {id:"vest_dg",     cat:"safety",   icon:"🦺", name:"背心 (深绿) Vest Dark Green",   sub:"", unit:"pcs",  qty:15, low:2},
  {id:"vest_grey",   cat:"safety",   icon:"🦺", name:"背心 (灰色) Vest Grey",         sub:"", unit:"pcs",  qty:20, low:2},
  {id:"vest_red",    cat:"safety",   icon:"🦺", name:"背心 (红色) Vest Red",          sub:"", unit:"pcs",  qty:17, low:2},
  {id:"vest_yellow", cat:"safety",   icon:"🦺", name:"背心 (黄色) Vest Yellow",       sub:"", unit:"pcs",  qty:0,  low:2},
  {id:"vest_purple", cat:"safety",   icon:"🦺", name:"背心 (紫色) Vest Purple",       sub:"", unit:"pcs",  qty:0,  low:2},
  {id:"glove_wb",    cat:"safety",   icon:"🧤", name:"手套 (白蓝) Gloves White/Blue", sub:"", unit:"pairs",qty:44, low:5},
  {id:"glove_grey",  cat:"safety",   icon:"🧤", name:"手套 (灰色) Gloves Grey",       sub:"", unit:"pairs",qty:156,low:10},
  
  // Tools
  {id:"loto_lock",   cat:"tools",    icon:"🔒", name:"LOTO 锁头 LOTO Lock",           sub:"停工安全锁 / Safety Padlock", unit:"pcs", qty:46, low:10},
  {id:"disc_107",    cat:"tools",    icon:"⚙️", name:"切割片 Cutting Disc 107mm",     sub:"107×1.2×16mm",            unit:"pcs", qty:70, low:10},
  {id:"disc_100",    cat:"tools",    icon:"⚙️", name:"切割片 Cutting Disc 100mm",     sub:"100×6×16mm",              unit:"pcs", qty:79, low:10},
  {id:"tape_measure",cat:"tools",    icon:"📏", name:"卷尺 Measuring Tape KAKO",      sub:"",                        unit:"pcs", qty:8,  low:2},
  {id:"battery",     cat:"tools",    icon:"🔋", name:"碱性电池 Greencell Battery",    sub:"1包=2粒 / 1 pack=2 pcs",    unit:"pack",qty:15, low:3},
  {id:"lock_biasa",  cat:"tools",    icon:"🔑", name:"普通锁 Normal Padlock",         sub:"",                        unit:"pcs", qty:8,  low:2},
  
  // Materials
  {id:"hose_blue",   cat:"materials",icon:"💧", name:"蓝水管 Sunny Hose Blue",        sub:"2\"×100M",                unit:"roll",qty:1,  low:1},
  {id:"delineator",  cat:"materials",icon:"🚧", name:"反光路障 Delineator",           sub:"Reflective traffic cone", unit:"pcs", qty:20, low:5},
  {id:"tape_by",     cat:"materials",icon:"📦", name:"警示胶带 (黑黄) Warning Tape",  sub:"Black & Yellow",          unit:"roll",qty:11, low:3},
  {id:"tape_grey",   cat:"materials",icon:"📦", name:"警示胶带 (灰色) Warning Tape",  sub:"Grey",                    unit:"roll",qty:44, low:5},
  {id:"bag_big",     cat:"materials",icon:"🛍️", name:"垃圾袋 (大黑) Plastic Bag Big", sub:"黑色 / Black",            unit:"pack",qty:39, low:5},
  {id:"bag_small",   cat:"materials",icon:"🛍️", name:"垃圾袋 (小蓝) Plastic Bag Small",sub:"蓝色 / Blue",             unit:"pack",qty:7,  low:2},
  {id:"flag_red",    cat:"materials",icon:"🚩", name:"旗帜 (红色) Flag Red",          sub:"",                        unit:"pcs", qty:24, low:5},
  {id:"flag_green",  cat:"materials",icon:"🚩", name:"旗帜 (绿色) Flag Green",        sub:"",                        unit:"pcs", qty:2,  low:3},
];

let ITEMS = [];
let checked = {};
let quantities = {}; 

function getQty(id){ return quantities[id] !== undefined ? quantities[id] : ITEMS.find(i=>i.id===id).qty; }

const statusEl = document.getElementById('sync-status');

async function initData() {
  try {
    const res = await fetch('/api/sync');
    const data = await res.json();
    
    if (data && data.items && data.items.length > 0 && data.items[0].qty !== undefined) {
      ITEMS = data.items;
      checked = data.checked || {};
    } else {
      ITEMS = JSON.parse(JSON.stringify(DEFAULT_ITEMS));
      checked = {};
    }
    statusEl.textContent = '🟢 已同步 Synced';
  } catch (error) {
    statusEl.textContent = '🔴 离线 Offline';
    ITEMS = JSON.parse(JSON.stringify(DEFAULT_ITEMS));
  }
  
  ITEMS.forEach(it => { quantities[it.id] = it.qty; });
  render();
}

async function saveDataToCloud() {
  statusEl.textContent = '⏳ 保存中 Saving...';
  
  ITEMS.forEach(it => { it.qty = quantities[it.id]; });

  try {
    const response = await fetch('/api/sync', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ items: ITEMS, checked: checked })
    });
    
    if (!response.ok) throw new Error('Failed to save');
    statusEl.textContent = '🟢 已同步 Synced';
  } catch (error) {
    console.error('Error:', error);
    statusEl.textContent = '🔴 同步失败 Failed';
  }
}

function updateProgress(){
  const total = ITEMS.length, done = Object.values(checked).filter(Boolean).length;
  const pct = total ? Math.round(done/total*100) : 0;
  document.getElementById('ptxt').textContent = done+' / '+total+' ('+pct+'%)';
  document.getElementById('pfill').style.width = pct+'%';
}

function toggleCheck(id){
  checked[id] = !checked[id];
  const el = document.querySelector('[data-id="'+id+'"]');
  if(el) el.classList.toggle('done', !!checked[id]);
  updateProgress();
  saveDataToCloud();
}

function startEdit(id){
  document.getElementById('d-'+id).style.display='none';
  const inp = document.getElementById('e-'+id);
  inp.style.display='inline-block';
  inp.value = getQty(id);
  inp.focus(); inp.select();
}

function finishEdit(id){
  const inp = document.getElementById('e-'+id);
  const disp = document.getElementById('d-'+id);
  const v = inp.value.trim();
  if(v !== ''){
    const n = isNaN(v) ? v : Number(v);
    quantities[id] = n;
    disp.textContent = n + ' ' + ITEMS.find(i=>i.id===id).unit;
    
    const row = document.querySelector('[data-id="'+id+'"]');
    const item = ITEMS.find(i=>i.id===id);
    if(row && item) row.classList.toggle('low-stock', !isNaN(n) && Number(n) <= item.low && Number(n) > 0);
  }
  inp.style.display='none';
  disp.style.display='inline-block';
  saveDataToCloud(); 
}

function doSearch(q){
  q = q.toLowerCase();
  CATS.forEach(cat=>{
    let vis=0;
    ITEMS.filter(i=>i.cat===cat.id).forEach(item=>{
      const el = document.querySelector('[data-id="'+item.id+'"]');
      if(!el) return;
      const show = item.name.toLowerCase().includes(q) || item.sub.toLowerCase().includes(q);
      el.classList.toggle('hidden',!show);
      if(show) vis++;
    });
    const ce = document.getElementById('cat-'+cat.id);
    if(ce) ce.classList.toggle('hidden', vis===0);
  });
}

function doReset(){
  if(!confirm('🚨 警告 Warning:\n这会彻底清空云端数据库并恢复默认库存。\nThis will wipe the cloud database and reset to default stock.\n\n确定继续吗？Are you sure to continue?')) return;
  ITEMS = JSON.parse(JSON.stringify(DEFAULT_ITEMS));
  checked = {};
  ITEMS.forEach(it => { quantities[it.id] = it.qty; });
  render();
  saveDataToCloud(); 
}

function render(){
  const inv = document.getElementById('inv');
  inv.innerHTML = CATS.map(cat=>{
    const items = ITEMS.filter(i=>i.cat===cat.id);
    return '<div class="cat-block" id="cat-'+cat.id+'" style="border:1.5px solid '+cat.border+'">'
      +'<div class="cat-head" style="background:'+cat.bg+';border-color:'+cat.border+'">'
      +'<span class="cat-name" style="color:'+cat.color+'">'+cat.name+'</span>'
      +'<span class="cat-badge" style="background:'+cat.color+'">'+items.length+' 项/items</span></div>'
      +items.map(item=>{
        const q = getQty(item.id);
        const qc = (q===0||q==='0') ? '#ef4444' : cat.color;
        const isLow = !isNaN(q) && Number(q)<=item.low && Number(q)>0;
        const isChecked = !!checked[item.id];
        return '<div class="row'+(isLow?' low-stock':'')+(isChecked?' done':'')+'" data-id="'+item.id+'">'
          +'<div class="chk" onclick="toggleCheck(\''+item.id+'\')">'
          +'<svg width="11" height="9" viewBox="0 0 11 9" fill="none"><path d="M1 4L4 7.5L10 1" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>'
          +'<span class="ricon">'+item.icon+'</span>'
          +'<div class="rtext-wrap"><div class="rname">'+item.name+'</div>'+(item.sub?'<div class="rsub">'+item.sub+'</div>':'')+'</div>'
          +'<div class="qty-wrap">'
          +'<span id="d-'+item.id+'" class="qty-disp" style="color:'+qc+';background:'+cat.bg+'" onclick="startEdit(\''+item.id+'\')">'+q+' '+item.unit+'</span>'
          +'<input id="e-'+item.id+'" class="qty-inp" type="text" onblur="finishEdit(\''+item.id+'\')" onkeydown="if(event.key===\'Enter\'||event.key===\'Escape\')finishEdit(\''+item.id+'\')">'
          +'</div></div>';
      }).join('')+'</div>';
  }).join('');
  updateProgress();
}

initData();
</script>
</body>
</html>
